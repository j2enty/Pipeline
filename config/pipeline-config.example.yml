# pipeline-config.example.yml
# 새 프로젝트 이식 시 이 파일을 복사해서 값을 채워넣으세요.
# install.sh가 이 파일을 읽어 org variables·secrets를 자동 등록합니다.

project:
  # GitHub 조직명 또는 사용자명 (org variables: PIPELINE_OWNER)
  owner: ""

  # parent issue가 있는 레포 — <owner>/<repo> 형식 (org variables: PIPELINE_PARENT_REPOSITORY)
  parent-repository: ""

  # 폴러가 동시에 모니터링할 GitHub Project v2 번호 배열 (App 환경변수: PROJECT_NUMBERS)
  # 프로젝트 URL의 마지막 숫자: github.com/orgs/<org>/projects/<number>
  # 여러 보드를 동시에 운영하는 경우 모두 나열 (예: 마일스톤 + 상시 CS 보드)
  project-numbers: [0]

  # self-hosted runner의 워크스페이스 루트 경로 (org variables: PIPELINE_WORKING_DIRECTORY)
  # 예: /Users/username/Projects/MyProject
  working-directory: ""

  # 슬랙 알림 채널 이름 (org variables: PIPELINE_SLACK_CHANNEL)
  # 미설정 시 Slack 알림 스킵 (파이프라인은 정상 진행)
  slack-channel: ""

modules:
  # 자동화를 적용할 모듈 목록
  # 각 모듈은 영역 레포 하나에 대응 (예: Backend → <org>/Backend 레포)
  #
  # 모듈 동작 의미론은 "명시 플래그"로 표현한다. 슬래시커맨드(/plan·/review·/kickoff)는
  # 이 플래그를 런타임에 읽어 어느 모듈을 어떻게 처리할지 결정한다(하드코딩 없음).
  - name: ""
    # role — 순수 사람용 주석(예: server/client/design/admin). 리더·코드는 읽지 않는다.
    #        모듈의 성격을 한눈에 보기 위한 라벨일 뿐, 동작은 아래 플래그로만 결정된다.
    role: ""
    # 해당 모듈의 CI workflow 이름 (GHA Actions 탭에 표시되는 이름)
    # auto-merge.yml이 CI pass 여부를 확인할 때 사용
    ci-workflow-name: ""
    # Project v2 Area 옵션 ID(해시) — kickoff 가 sub-issue 의 Area 필드를 세팅할 때 사용.
    # (구버전 claude-commands.area-ids 맵을 대체. 리더는 이 값을 우선 읽고 없으면 맵으로 폴백.)
    area-id: ""
    # planner/review/kickoff — 해당 슬래시커맨드 동작 대상에 포함할지 (미지정 시 기본 true)
    planner: true
    review: true
    kickoff: true
    # lead — 선행(먼저 처리) 모듈 여부 (미지정 시 기본 false).
    #        true 가 2개 이상이면 정의(나열)순으로 직렬 선행 처리된다.
    lead: false
    # default-status — kickoff 시 부여할 기본 Project Status (미지정 시 기본 Ready)
    default-status: Ready
    # cross-area-group — 같은 그룹끼리 묶어 처리할 때 그룹명(예: client). 미지정 시 빈 값.
    cross-area-group: ""
    # (선택, 기본 true) Reviewer 봇 리뷰만 머지 차단 기준으로 볼지 여부
    # true: Reviewer 봇의 CHANGES_REQUESTED만 차단 기준
    # false: 봇 외 다른 리뷰어의 CHANGES_REQUESTED도 허용(완화)
    # 미지정 모듈은 자동으로 true (org variables: PIPELINE_STRICT_REVIEW_BOT_CHECK)
    # strict-review-bot-check: true

  # 추가 모듈 예시:
  # - name: Admin
  #   role: admin
  #   ci-workflow-name: Admin CI
  #   area-id: ""
  #   strict-review-bot-check: false
  # - name: iOS
  #   role: client
  #   ci-workflow-name: iOS CI
  #   area-id: ""
  #   cross-area-group: client
  # - name: Design          # 디자인 영역 — 코드 동작 제외 예시
  #   role: design
  #   planner: false
  #   review: false
  #   kickoff: false
  #   default-status: Backlog

modules-ignore:
  # 자동화에서 제외할 모듈 목록 (org variables: PIPELINE_MODULES_IGNORE)
  # critic·dispatch 등 multi-module 판정 시 이 목록은 sibling 집계에서 제외
  # 예: Design, Docs 등 코드 변경이 없는 영역
  - ""

reviewer:
  # AI 리뷰(Reviewer 봇) 사용 여부
  # false 이면 REVIEWER_* secrets 등록 불필요
  enabled: false

pipeline:
  # 이 Pipeline 프레임워크가 사는 레포 (호출자 yml의 uses: 경로에 들어감)
  repo: <owner>/Pipeline
  # 핀할 ref (브랜치 또는 태그, 안정화 후 v1.0 등으로 핀 권장)
  ref: main

claude-commands:
  # Claude 슬래시커맨드(/review, /kickoff, /plan)를 워크스페이스 루트의
  # .claude/commands/ 에 로컬 파일로 배포할지 여부.
  # install.sh가 templates/claude-commands/*.md.tmpl 을 아래 값으로 치환해 배포한다.
  # 배포 대상 디렉토리 = project.working-directory + "/.claude/commands"
  # (별도 경로 항목 없음 — working-directory 재사용)
  #
  # 아래 일부 값(__ORG__/__PARENT_REPO_NAME__/__PROJECT_NUMBER__/__SLACK_CHANNEL__)은
  # project 섹션에서 자동 파생되므로 여기 다시 적지 않는다 (설정 중복 방지).
  enabled: false

  # 프로젝트 표시 이름 (커맨드 본문에서 프로젝트명으로 사용)
  project-name: ""

  # GitHub Project v2 노드 ID (PVT_... 형식)
  project-id: ""
  # Project v2 의 Status 필드 ID (PVTSSF_... 형식)
  status-field-id: ""
  # Project v2 의 Area(영역) 필드 ID (PVTSSF_... 형식)
  area-field-id: ""

  # Reviewer 봇 App ID (숫자)
  reviewer-app-id: ""
  # Reviewer 봇 slug (예: my-review-bot — '[bot]' 접미사 없는 순수 slug)
  reviewer-bot-slug: ""
  # Reviewer 봇 토큰 키 prefix — 환경변수/secret 이름의 공통 접두어
  #   예: MY_REVIEW_BOT → MY_REVIEW_BOT_APP_ID, MY_REVIEW_BOT_PRIVATE_KEY 등
  reviewer-token-key: ""

  # Slack webhook 토큰 키 (환경변수/secret 이름)
  slack-token-key: ""

  # PR 작성 봇(Author)의 GitHub 로그인 이름 (slug, '[bot]' 없이)
  author-login: ""
  # 로컬 머신에서 git push 할 때 쓰는 개인 GitHub 계정
  local-account: ""
  # 프로젝트 컨텍스트 문서 디렉토리 (워크스페이스 루트 기준 상대 경로)
  #   예: Docs/claude/context
  docs-context-dir: ""

  # ── 구버전 area-ids 맵 — 이제 modules[].area-id 사용 권장 ──────────────
  # 영역(모듈)명 → Project v2 Area 옵션 ID(해시) 매핑.
  # 리더·install.sh 는 modules[].area-id 를 우선 읽고, 없을 때만 이 맵으로 폴백한다.
  # 신규 이식에서는 위 modules[].area-id 에 적는 것을 권장(이 맵은 하위호환 폴백용).
  # 키 이름은 모듈명과 동일하게 — install.sh가 대문자로 바꿔 placeholder 와 매칭
  #   (예: Backend → __AREA_ID_BACKEND__).
  # area-ids:
  #   Backend: ""
  #   Admin: ""
  #   Frontend: ""
  #   iOS: ""
  #   Android: ""
  #   Design: ""

  plan:
    # ③ 완결성 critic — AI용 명세 생성 직후 단일 모델 검사 (기본 ON)
    completeness-critic-enabled: true
    # ⑤ 정합성 critic — 사람 게이트 직전 검사 (기본 ON)
    consistency-critic-enabled: true
    # ⑤ 이중 모델 (Claude+Codex 교차, 기본 ON / 비용 절감 시 false)
    consistency-critic-dual-model: true
    # ② 영역 간 공유 계약 문서(contract.md) — 2개 이상 영역이 만날 때 생성 (기본 ON)
    contract-doc-enabled: true

tracking:
  # finding(리뷰 지적) 추적 이슈 자동 생성 on/off (미설정 시 false)
  # true 이면 install.sh 가 영역 레포 + parent 레포에 추적 라벨을 자동 등록한다.
  enabled: false
  # severity → 라벨명 (미설정 시 기본값: major-issue / minor-issue)
  major-label: "major-issue"
  minor-label: "minor-issue"
