# Reclip 프로젝트 Pipeline 설정
# 첫 번째 적용 사례 — projects/reclip/

project:
  owner: MKFactory-Reclip
  parent-repository: MKFactory-Reclip/Reclip
  # 폴러가 동시에 모니터링할 GitHub Project v2 번호 배열
  # (예: 마일스톤 보드 + 상시 CS/버그 보드)
  project-numbers: [3]
  working-directory: /Users/miller/Home/Develop/MKFactory/Reclip
  slack-channel: "#reclip-alerts"

modules:
  # 각 모듈의 동작 의미론을 명시 플래그로 표현한다.
  #   role:             순수 사람용 주석(server/client/design/admin). 리더는 읽지 않음.
  #   planner/review/kickoff: 해당 슬래시커맨드 동작 대상에 포함할지 (기본 true)
  #   lead:             선행(먼저 처리) 모듈 여부 (기본 false)
  #   default-status:   kickoff 시 부여할 기본 Project Status (기본 Ready)
  #   cross-area-group: 같은 그룹끼리 묶어 처리(예: client 영역 공통). 미지정 시 빈 값.
  #   area-id:          Project v2 Area 옵션 ID(해시). 구버전 area-ids: 맵을 대체.
  - name: Backend
    role: server
    ci-workflow-name: Backend CI
    area-id: 7a506b5e
    planner: true
    review: true
    kickoff: true
    lead: true               # 다른 영역의 선행 — 먼저 직렬 처리
    default-status: Ready
  - name: Admin
    role: admin
    ci-workflow-name: Admin CI
    area-id: 5a5a0f78
    planner: true
    review: true
    kickoff: true
    default-status: Ready
    # Admin은 Reviewer 봇 외 리뷰도 허용 (strict 완화)
    strict-review-bot-check: false
  - name: Frontend
    role: client
    ci-workflow-name: Frontend CI
    area-id: 40db0ae8
    planner: true
    review: true
    kickoff: true
    default-status: Ready
    cross-area-group: client
  - name: iOS
    role: client
    ci-workflow-name: ""
    area-id: 2f0a7bda
    planner: true
    review: true
    kickoff: true
    default-status: Ready
    cross-area-group: client
  - name: Android
    role: client
    ci-workflow-name: ""
    area-id: 7394b300
    planner: true
    review: true
    kickoff: true
    default-status: Ready
    cross-area-group: client
  - name: Design
    role: design
    ci-workflow-name: ""
    area-id: 56405937
    planner: false           # 디자인은 plan/review/kickoff 대상 아님
    review: false
    kickoff: false
    default-status: Backlog   # 디자인 작업은 Backlog 로 적재

modules-ignore:
  - Design

reviewer:
  enabled: true

pipeline:
  repo: j2enty/Pipeline
  ref: main

claude-commands:
  # /review, /kickoff, /plan 슬래시커맨드(플러그인 skill)가 실행 시 읽는 프로젝트값.
  # owner/parent-repo-name/project-number/slack-channel 은 project 섹션에서 자동 파생.
  # (P3.4: 옛 .tmpl 배포 폐기 → 런타임 리더가 이 값들을 읽음. enabled 는 미사용 — 하위호환 잔존.)
  enabled: true

  project-name: Reclip

  project-id: PVT_kwDOEH36Hs4BU4t1
  status-field-id: PVTSSF_lADOEH36Hs4BU4t1zhIm_rs
  area-field-id: PVTSSF_lADOEH36Hs4BU4t1zhIoXNU

  reviewer-app-id: "3569774"
  reviewer-bot-slug: reclip-review-bot
  reviewer-token-key: RECLIP_REVIEW_BOT

  slack-token-key: RECLIP_SLACK_WEBHOOK

  author-login: mkfactory-app
  local-account: j2enty
  docs-context-dir: Docs/claude/context

  # codex 교차검증(plan `codex exec` + review `codex review`) 공통 모델·reasoning effort
  # (본체 기본은 빈값=codex 기본). Reclip 계정은 더 강한 모델이 가용하므로 gpt-5.5 + high 로 주입한다.
  codex-model: gpt-5.5
  codex-reasoning-effort: high

  # ── 구버전 area-ids 맵 — modules[].area-id 로 이관 완료 ──────────────
  # 리더·install.sh 는 modules[].area-id 를 우선 읽고, 없을 때만 이 맵으로 폴백한다.
  # 신규 이식에서는 modules[].area-id 사용 권장(이 맵은 하위호환 폴백용으로만 유지).
  area-ids:
    Backend: 7a506b5e
    Admin: 5a5a0f78
    Frontend: 40db0ae8
    iOS: 2f0a7bda
    Android: 7394b300
    Design: 56405937

  plan:
    # ③ 완결성 critic — AI용 명세 생성 직후 단일 모델 검사 (기본 ON)
    completeness-critic-enabled: true
    # ⑤ 정합성 critic — 사람 게이트 직전 검사 (기본 ON)
    consistency-critic-enabled: true
    # ⑤ 이중 모델 (Claude+Codex 교차, 기본 ON / 비용 절감 시 false)
    consistency-critic-dual-model: true
    # ② 영역 간 공유 계약 문서(contract.md) — 2개 이상 영역이 만날 때 생성 (기본 ON)
    contract-doc-enabled: true

  # 📊 시간·토큰·비용 계측 — 각 claude 호출 usage 를 이슈/PR 코멘트로 박제 (기본 OFF, #82)
  metrics:
    usage-tracking-enabled: true

  # 🔔 /plan 종료 시 Janus 버튼 알림 발사 (기본 OFF, #37). 이름표가 가리키는 env 는
  #   운영 머신/컨테이너에서 실제 Janus 주소·토큰을 담는다(slack-token-key=RECLIP_SLACK_WEBHOOK 관례와 동일).
  janus:
    notify-enabled: true
    base-url-key: RECLIP_JANUS_URL
    token-key: RECLIP_JANUS_TOKEN

tracking:
  # finding(리뷰 지적) 추적 이슈 자동 생성 on/off
  enabled: true
  major-label: "major-issue"
  minor-label: "minor-issue"
