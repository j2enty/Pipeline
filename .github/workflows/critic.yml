name: critic

on:
  workflow_call:
    inputs:
      pr-repo:
        description: "현재 PR 레포 (owner/repo)"
        type: string
        required: true
      pr-number:
        description: "현재 PR 번호"
        type: string
        required: true
      reviewer-bot-login:
        description: "Reviewer 봇 로그인 이름 — 미설정 시 vars.PIPELINE_REVIEWER_BOT_LOGIN"
        type: string
        required: false
        default: ''
      working-directory:
        description: "self-hosted runner 작업 디렉토리"
        type: string
        required: true
      owner:
        description: "GitHub 조직/사용자"
        type: string
        required: true
      parent-repository:
        description: "parent issue 레포 (<owner>/<repo>)"
        type: string
        required: true
      verdict-state-dir:
        description: "critic verdict 상태 파일 디렉토리"
        type: string
        required: false
        default: '.omc/state/reviews'
      modules-ignore:
        description: "제외 모듈 JSON 배열 (예: '[\"Design\"]')"
        type: string
        required: false
        default: '[]'
      strict-review-bot-check:
        description: "true: 누구의 CHANGES_REQUESTED든 차단 / false: Reviewer 봇 것만"
        type: boolean
        required: false
        default: true
      tracking-enabled:
        description: "true: critic findings 를 track-findings 로 라벨 이슈 추적 / false: 머지만(기존 동작)"
        type: boolean
        required: false
        default: false
      pipeline-repo:
        description: "Pipeline 레포 (owner/repo) — 추적 action 체크아웃 대상. tracking-enabled=true 시 필수"
        type: string
        required: false
        default: ''
      pipeline-ref:
        description: "Pipeline 레포 ref — 추적 action 체크아웃 시 사용. 미설정 시 기본 브랜치"
        type: string
        required: false
        default: ''
      major-label:
        description: "major finding 이슈에 붙일 라벨 (tracking-enabled=true 시)"
        type: string
        required: false
        default: 'major-issue'
      minor-label:
        description: "minor finding 이슈에 붙일 라벨 (tracking-enabled=true 시)"
        type: string
        required: false
        default: 'minor-issue'
    secrets:
      AUTHOR_APP_ID:
        required: true
      AUTHOR_PRIVATE_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-and-critic:
    runs-on: ubuntu-latest
    outputs:
      all_approved: ${{ steps.check.outputs.all_approved }}
      parent_url: ${{ steps.check.outputs.parent_url }}
      sibling_count: ${{ steps.check.outputs.sibling_count }}
      blocked: ${{ steps.check.outputs.blocked }}
    concurrency:
      group: critic-check-${{ inputs.pr-repo }}-${{ inputs.pr-number }}
      cancel-in-progress: false
    steps:
      - name: App 토큰 발급
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sibling 전부 APPROVED 확인
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_REPO: ${{ inputs.pr-repo }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REVIEWER_BOT_LOGIN: ${{ inputs.reviewer-bot-login != '' && inputs.reviewer-bot-login || vars.PIPELINE_REVIEWER_BOT_LOGIN }}
          MODULES_IGNORE: ${{ inputs.modules-ignore }}
          STRICT_REVIEW_BOT_CHECK: ${{ inputs.strict-review-bot-check }}
        run: |
          set -euo pipefail

          # PR 이 이미 머지/닫혔으면 critic 불필요 (#18 버그 수정)
          # post-merge 재실행 시 "검증 불능" 오경보를 방지한다.
          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "$PR_REPO" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
          if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR 이미 $PR_STATE — critic 스킵 (post-merge 재실행 방지)"
            echo "all_approved=false" >> "$GITHUB_OUTPUT"
            echo "blocked=pr-already-$PR_STATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_OWNER=$(echo "$PR_REPO" | cut -d/ -f1)
          PR_REPO_NAME=$(echo "$PR_REPO" | cut -d/ -f2)
          BOT_PREFIX="${REVIEWER_BOT_LOGIN%%\[*}"

          # $owner/$repo/$num 는 GraphQL 변수 — single quote 안 미확장 의도적
          # shellcheck disable=SC2016
          SUB_ISSUE_JSON=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $num: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $num) {
                  closingIssuesReferences(first: 5) {
                    nodes {
                      number
                      repository { nameWithOwner }
                      parent {
                        number
                        repository { nameWithOwner }
                        subIssues(first: 50) {
                          nodes {
                            number state
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          ' -f owner="$PR_OWNER" -f repo="$PR_REPO_NAME" -F num="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0]')

          if [ -z "$SUB_ISSUE_JSON" ] || [ "$SUB_ISSUE_JSON" = "null" ]; then
            echo "PR 이 sub-issue 를 닫지 않음 — critic 스킵"
            echo "all_approved=false" >> "$GITHUB_OUTPUT"
            echo "blocked=no-sub-issue" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARENT_JSON=$(echo "$SUB_ISSUE_JSON" | jq '.parent')
          if [ -z "$PARENT_JSON" ] || [ "$PARENT_JSON" = "null" ]; then
            echo "Sub-issue 에 parent 없음 — critic 스킵"
            echo "all_approved=false" >> "$GITHUB_OUTPUT"
            echo "blocked=no-parent" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARENT_REPO=$(echo "$PARENT_JSON" | jq -r '.repository.nameWithOwner')
          PARENT_NUM=$(echo "$PARENT_JSON" | jq -r '.number')
          PARENT_URL="https://github.com/$PARENT_REPO/issues/$PARENT_NUM"
          echo "parent_url=$PARENT_URL" >> "$GITHUB_OUTPUT"

          # modules-ignore 필터 적용
          # $name/$ignore 는 jq 변수 — single quote 안 미확장 의도적
          # shellcheck disable=SC2016
          SIBLINGS=$(echo "$PARENT_JSON" | jq -c --argjson ignore "$MODULES_IGNORE" \
            '.subIssues.nodes[] | select((.repository.nameWithOwner | split("/") | last) as $name | ($ignore | index($name) | not))')
          SIBLING_COUNT=$(echo "$SIBLINGS" | grep -c '^{' || echo 0)
          echo "sibling_count=$SIBLING_COUNT" >> "$GITHUB_OUTPUT"
          echo "Sibling (modules-ignore 제외): $SIBLING_COUNT"

          if [ "$SIBLING_COUNT" -le 1 ]; then
            echo "단일 영역 — auto-merge 가 처리"
            echo "all_approved=false" >> "$GITHUB_OUTPUT"
            echo "blocked=single-area" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALL_APPROVED=true
          while IFS= read -r SIBLING; do
            [ -z "$SIBLING" ] && continue
            S_REPO=$(echo "$SIBLING" | jq -r '.repository.nameWithOwner')
            S_NUM=$(echo "$SIBLING" | jq -r '.number')
            S_OWNER=$(echo "$S_REPO" | cut -d/ -f1)
            S_REPO_NAME=$(echo "$S_REPO" | cut -d/ -f2)

            # $owner/$repo/$num 는 GraphQL 변수 — single quote 안 미확장 의도적
            # shellcheck disable=SC2016
            SIBLING_PR=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $num: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $num) {
                    state
                    closedByPullRequestsReferences(first: 5, includeClosedPrs: false) {
                      nodes {
                        number state
                        labels(first: 20) { nodes { name } }
                        reviews(first: 50) { nodes { state author { login } } }
                      }
                    }
                  }
                }
              }
            ' -f owner="$S_OWNER" -f repo="$S_REPO_NAME" -F num="$S_NUM" \
              --jq '.data.repository.issue')

            S_STATE=$(echo "$SIBLING_PR" | jq -r '.state')
            if [ "$S_STATE" = "CLOSED" ]; then
              echo "  $S_REPO#$S_NUM — closed (완료로 간주)"
              continue
            fi

            PR_NODES=$(echo "$SIBLING_PR" | jq '.closedByPullRequestsReferences.nodes')
            if [ "$(echo "$PR_NODES" | jq 'length')" = "0" ]; then
              echo "  $S_REPO#$S_NUM — 연결 PR 없음 — 미완료"
              ALL_APPROVED=false; break
            fi

            HAS_BLOCKED=$(echo "$PR_NODES" | jq '[.[] | .labels.nodes[] | select(.name == "blocked")] | length')
            if [ "$HAS_BLOCKED" -gt 0 ]; then
              echo "  $S_REPO#$S_NUM — blocked 라벨"
              echo "blocked=blocked-label" >> "$GITHUB_OUTPUT"
              ALL_APPROVED=false; break
            fi

            APPROVED=$(echo "$PR_NODES" | jq --arg bot "$BOT_PREFIX" \
              '[.[] | .reviews.nodes[] | select((.author.login | startswith($bot)) and .state == "APPROVED")] | length')
            if [ "$APPROVED" = "0" ]; then
              echo "  $S_REPO#$S_NUM — Reviewer 봇 APPROVE 없음"
              ALL_APPROVED=false; break
            fi

            if [ "$STRICT_REVIEW_BOT_CHECK" = "true" ]; then
              CHANGES=$(echo "$PR_NODES" | jq \
                '[.[] | .reviews.nodes[] | select(.state == "CHANGES_REQUESTED")] | length')
            else
              CHANGES=$(echo "$PR_NODES" | jq --arg bot "$BOT_PREFIX" \
                '[.[] | .reviews.nodes[] | select((.author.login | startswith($bot)) and .state == "CHANGES_REQUESTED")] | length')
            fi
            if [ "$CHANGES" != "0" ]; then
              echo "  $S_REPO#$S_NUM — CHANGES_REQUESTED 존재"
              echo "blocked=changes-requested" >> "$GITHUB_OUTPUT"
              ALL_APPROVED=false; break
            fi
            echo "  $S_REPO#$S_NUM — APPROVED"
          done < <(echo "$SIBLINGS")

          if [ "$ALL_APPROVED" = "true" ]; then
            echo "all_approved=true" >> "$GITHUB_OUTPUT"
            echo "blocked=" >> "$GITHUB_OUTPUT"
            echo "모든 sibling APPROVED — critic 진행"
          else
            echo "all_approved=false" >> "$GITHUB_OUTPUT"
          fi

  run-critic:
    needs: check-and-critic
    if: needs.check-and-critic.outputs.all_approved == 'true'
    runs-on: self-hosted
    timeout-minutes: 60
    concurrency:
      group: critic-run-${{ needs.check-and-critic.outputs.parent_url }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # [수정 1] tracking-enabled=true 인데 pipeline-repo 가 비어 있으면 즉시 실패.
      # 이 조합에서는 Pipeline 체크아웃이 스킵되어 resolve-review-statefile.sh 가 없고,
      # concerns 시 PR 머지는 완료되는데 추적이 조용히 스킵된다("켰는데 추적 없음"이
      # 성공 처리). 침묵 오작동보다 명시적 fail-fast 가 낫다 — 설정 오류를 즉시 표면화.
      - name: tracking 설정 검증 (fail-fast)
        if: ${{ inputs.tracking-enabled && inputs.pipeline-repo == '' }}
        run: |
          echo "::error::tracking-enabled=true 로 설정됐지만 pipeline-repo 가 비어 있습니다. tracking-enabled=true 시 pipeline-repo(Pipeline 레포 경로, 예: org/Pipeline)는 필수 입력입니다. caller yml 에 pipeline-repo 를 추가하거나, tracking-enabled 를 false 로 설정하세요."
          exit 1

      # Pipeline 레포(reusable workflow 정의 레포)를 별도 디렉토리에 체크아웃한다.
      # 두 가지 용도로 쓰인다:
      #   (1) track-findings composite action — 상대경로 uses(./actions/track-findings)
      #       (tracking-enabled=true 일 때만 실행)
      #   (2) resolve-review-statefile.sh — verdict 파싱이 상태파일을 결정적으로
      #       식별하는 스크립트. verdict 파싱은 tracking 과 무관하게 "항상" 돈다(이슈 #9).
      # 이 reusable workflow 가 영역(caller) 레포에서 호출되면 actions/checkout 의 기본
      # 대상은 caller(영역) 레포라 위 자산들이 없어 실패한다. 따라서 Pipeline 레포
      # (repository/ref)를 명시해 정확히 체크아웃한다(식별자는 input 주입).
      # working-directory(self-hosted 실제 작업 경로)·위 영역 레포 체크아웃을 덮어쓰지
      # 않도록 path 로 별도 디렉토리에 체크아웃한다(review.yml 과 동일 패턴).
      #
      # 조건: pipeline-repo 가 주어졌을 때만 체크아웃(tracking 무관). 이슈 #9 의 결정적
      # 식별을 쓰려면 caller 가 pipeline-repo 를 넘겨야 한다. pipeline-repo 미설정인
      # 기존 caller(예: tracking 미사용)는 체크아웃이 스킵되고 verdict 파싱이 인라인
      # 폴백으로 동작한다 → 회귀 0(기존 추측매칭과 완전 동일).
      # 전제: Pipeline 레포가 public 이다. 아래 actions/checkout 은 token 을 명시하지 않아
      # caller 의 GITHUB_TOKEN 으로 받는데, 이 토큰은 caller(영역) 레포 권한만 가져 타 레포
      # (Pipeline)는 public 일 때만 읽힌다. Pipeline 을 private/internal 로 전환하면 여기에
      # 별도 token(PAT 또는 App 토큰) input 을 추가로 넘겨야 한다(caller GITHUB_TOKEN 으로는 실패).
      - name: Pipeline 체크아웃 (추적 action + 상태파일 식별 스크립트용)
        if: ${{ inputs.pipeline-repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline-action-checkout

      - name: /review --bot (critic-only) 실행
        env:
          PARENT_URL: ${{ needs.check-and-critic.outputs.parent_url }}
          VERDICT_STATE_DIR: ${{ inputs.verdict-state-dir }}
        run: |
          set -euo pipefail
          # [버그 #B 방어 — marker 방식 fail-closed]
          # critic 실행 "직전"에 marker 파일을 만든다. 아래 verdict 파싱 step 은 매칭된
          # 상태파일이 이 marker 보다 "새것"(-nt)인지 확인해 "이번 실행이 쓴 파일"임을 검증한다.
          # 이전 critic 실행이 남긴 stale 상태파일(marker 보다 older)을 이번 결과로 오신뢰해
          # 낡은 pass 로 머지되던 치명 버그를 차단한다.
          # marker 경로는 같은 job(self-hosted) 내 다음 step 과 GITHUB_ENV 로 공유한다.
          # ($$/PID 는 step 마다 다른 셸이라 공유 불가 → GITHUB_ENV 로 명시 전달. run-id 로 동시 실행 충돌 회피.)
          # (이슈 #9 해결) 결정적 식별은 아래 REVIEW_STATE_SENTINEL 로 /review 가 자기가 쓴
          # 상태파일 경로를 직접 기록하게 했다. marker(-nt)는 그 위에 남은 "이번 실행이 그 파일을
          # 실제로 새로 썼는지" 확인하는 보조 fail-closed 방어다(둘은 직교 — 식별 vs 신선도).
          mkdir -p "$VERDICT_STATE_DIR"
          CRITIC_RUN_MARKER="$VERDICT_STATE_DIR/.critic-run-marker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          touch "$CRITIC_RUN_MARKER"
          echo "CRITIC_RUN_MARKER=$CRITIC_RUN_MARKER" >> "$GITHUB_ENV"

          # [이슈 #9 — sentinel 결정적 식별]
          # marker(-nt 추측)와 별개로, /review 가 "이번 실행이 최종적으로 쓴 STATE_FILE 의
          # 절대경로"를 직접 기록할 sentinel 파일 경로를 준비한다(run-id+attempt 로 동시실행/
          # 재시도 격리 — marker 와 동일 원리). 아래 verdict 파싱 step 이 이 sentinel 을 읽어
          # 상태파일을 추측 없이 식별한다. /review 가 sentinel 을 안 쓰면(구버전/미기록)
          # 식별 스크립트가 자동으로 기존 추측매칭으로 폴백한다(하위호환·fail-closed 보존).
          REVIEW_STATE_SENTINEL="$VERDICT_STATE_DIR/.review-statefile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.path"
          rm -f "$REVIEW_STATE_SENTINEL"
          echo "REVIEW_STATE_SENTINEL=$REVIEW_STATE_SENTINEL" >> "$GITHUB_ENV"

          # /review 가 종료 직전 자기가 쓴 상태파일 경로를 sentinel 에 기록하도록 env 주입.
          REVIEW_STATE_SENTINEL="$REVIEW_STATE_SENTINEL" \
            claude --dangerously-skip-permissions -p "/review $PARENT_URL --bot --critic-only"

      - name: Critic verdict 파싱
        id: verdict
        env:
          VERDICT_STATE_DIR: ${{ inputs.verdict-state-dir }}
          PARENT_URL: ${{ needs.check-and-critic.outputs.parent_url }}
        run: |
          set -euo pipefail
          # verdict 는 머지/blocker 분기를 결정하므로 "현재 parent" 상태파일을 정확히 읽어야 한다.
          #
          # [이슈 #9 — 결정적 식별 + 추측매칭 폴백]
          # 1순위: Pipeline 레포가 체크아웃됐으면 resolve-review-statefile.sh 로 식별한다.
          #   이 스크립트는 sentinel(이번 실행 /review 가 직접 기록한 절대경로)을 신뢰하고,
          #   sentinel 이 없거나 무효이면 기존 추측매칭(.parent.url 정확매칭·단일강제)으로 폴백한다.
          #   성공 시 STATE_FILE 절대경로를 stdout 1줄로 주고 exit 0, indeterminate 면 빈출력+exit 1.
          # 2순위(폴백): Pipeline 미체크아웃(기존 caller — pipeline-repo 미설정)이면 스크립트가
          #   없으므로 인라인 추측매칭으로 식별한다. → 회귀 0(스크립트 폴백과 동일 로직).
          #
          # 어느 경로든 결과는 "STATE_FILE(절대경로) + MATCH_COUNT(1=식별/0=indeterminate)"로 통일해
          # 아래 marker(-nt) stale 검증 + verdict 읽기는 그대로 재사용한다.
          # marker -nt 검증은 "어느 파일"과 별개의 방어(이번 실행이 그 파일을 새로 썼는지)라 계속 둔다.
          RESOLVE_SH=".pipeline-action-checkout/scripts/resolve-review-statefile.sh"
          MATCH_COUNT=0
          STATE_FILE=""
          if [ -f "$GITHUB_WORKSPACE/$RESOLVE_SH" ]; then
            rc=0
            STATE_FILE="$(VERDICT_STATE_DIR="$VERDICT_STATE_DIR" PARENT_URL="$PARENT_URL" \
              REVIEW_STATE_SENTINEL="${REVIEW_STATE_SENTINEL:-}" \
              bash "$GITHUB_WORKSPACE/$RESOLVE_SH" critic)" || rc=$?
            if [ "$rc" -eq 0 ] && [ -n "$STATE_FILE" ]; then
              MATCH_COUNT=1
            else
              MATCH_COUNT=0
              STATE_FILE=""
            fi
          else
            # 인라인 폴백 — .parent.url 정확매칭(jq) 단일강제. grep 부분매칭 금지
            # (issues/3 이 issues/30·issues/35 까지 잡는 문제 회피).
            if [ -d "$VERDICT_STATE_DIR" ]; then
              for f in "$VERDICT_STATE_DIR"/*.json; do
                [ -f "$f" ] || continue
                if [ "$(jq -r '.parent.url // empty' "$f" 2>/dev/null)" = "$PARENT_URL" ]; then
                  MATCH_COUNT=$((MATCH_COUNT + 1))
                  STATE_FILE="$f"
                fi
              done
            fi
          fi

          if [ "$MATCH_COUNT" -eq 1 ]; then
            # 정확히 1개 매칭 — 정상 흐름 후보. 단, "이번 실행이 쓴 파일"인지 marker 로 검증한다.
            #
            # [버그 #B 방어 — stale 상태파일 오신뢰 차단, fail-closed]
            # 매칭된 STATE_FILE 이 critic 실행 step 이 만든 marker 보다 "새것"(-nt)이어야
            # "이번 실행이 새로 쓴 verdict"로 신뢰할 수 있다. marker 보다 older 면 이전 critic
            # 실행이 남긴 stale 파일이고, 이번 실행이(버그/스키마 문제로) verdict 를 못 쓴 것이므로
            # 낡은 pass 로 머지되지 않게 indeterminate 로 강등한다.
            # marker 가 없으면(이론상 안 일어나지만 방어적으로) 검증 불능으로 처리한다.
            if [ -z "${CRITIC_RUN_MARKER:-}" ] || [ ! -e "$CRITIC_RUN_MARKER" ]; then
              echo "::error::critic verdict 검증 불능 — marker 파일 없음(critic 실행 step 미수행 의심). fail-closed 로 머지 차단."
              CRITIC_VERDICT="indeterminate"
            elif [ ! "$STATE_FILE" -nt "$CRITIC_RUN_MARKER" ]; then
              echo "::error::critic verdict 검증 불능 — 매칭 상태파일($STATE_FILE)이 marker 보다 오래됨(stale). 이번 실행이 verdict 를 쓰지 않음. fail-closed 로 머지 차단."
              CRITIC_VERDICT="indeterminate"
            else
              # 이번 실행이 쓴 파일 확정 — 그 파일의 verdict 를 읽는다.
              CRITIC_VERDICT=$(jq -r '.aggregate.verdict // empty' "$STATE_FILE" 2>/dev/null || echo "")
              # verdict 필드가 비어 있으면(스키마 손상 등) 검증 불능으로 강등 — fail-closed.
              if [ -z "$CRITIC_VERDICT" ]; then
                echo "::error::critic verdict 검증 불능 — 상태파일($STATE_FILE)에 .aggregate.verdict 없음/빈값"
                CRITIC_VERDICT="indeterminate"
              fi
            fi
          else
            # 0개 또는 2개+ — 검증 불능(indeterminate). 어느 머지 step 의 if 에도 안 걸려 머지 안 됨.
            echo "::error::critic verdict 검증 불능 — PARENT_URL($PARENT_URL) 매칭 상태파일 $MATCH_COUNT 개(0 또는 2개+). fail-closed 로 머지 차단."
            CRITIC_VERDICT="indeterminate"
          fi

          # [버그 #A 방어 — verdict enum allowlist 정규화, GHA output 인젝션 차단]
          # 비정상 multiline/임의 문자열이 GITHUB_OUTPUT(env-file 형식)을 깨거나 pass 로 오해석되지
          # 않도록, GITHUB_OUTPUT 에 쓰기 "직전" allowlist 로 정규화한다. 화이트리스트 밖 값은
          # 전부 indeterminate 로 흡수 → 출력은 항상 pass|concerns|blocker|indeterminate 중 하나.
          # 비정상 값은 위 fail-closed 머지 차단 경로(if != pass/concerns/blocker)가 처리한다.
          case "$CRITIC_VERDICT" in
            pass|concerns|blocker) ;;
            *) CRITIC_VERDICT="indeterminate" ;;
          esac
          echo "critic_verdict=$CRITIC_VERDICT" >> "$GITHUB_OUTPUT"

          # [수정 4] verdict 파싱 step 이 식별한 STATE_FILE 경로를 output 으로 내보낸다.
          # concerns-merge step 이 재식별 없이 이 값을 재사용한다(TOCTOU 제거 + 일관성).
          # indeterminate 경로(빈값)도 그대로 내보낸다 — concerns-merge step 은
          # critic_verdict==concerns 일 때만 실행되므로 빈값이면 추적 스킵으로 안전 처리됨.
          echo "resolved-state-file=$STATE_FILE" >> "$GITHUB_OUTPUT"

          # marker 정리 — 남겨도 다음 실행이 새 run-id 로 touch 하므로 무방하나, 누적 방지로 제거.
          rm -f "${CRITIC_RUN_MARKER:-}"

      - name: App 토큰 발급
        id: merge-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Blocker — Slack 에스컬레이션 + 머지 차단
        if: steps.verdict.outputs.critic_verdict == 'blocker'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PARENT_URL: ${{ needs.check-and-critic.outputs.parent_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # printf 로 body 구성 — YAML 멀티라인 0칸 들여쓰기 방지
          BODY=$(printf '## 🚨 critic blocker 발견 — 머지 차단\n\ncritic 리뷰에서 blocker 가 발견됐어요. 머지 전 확인이 필요합니다.\n\n**Actions 로그**: %s' "$RUN_URL")
          COMMENT_URL=$(gh issue comment "$PARENT_URL" \
            --body "$BODY" \
            --json url --jq .url 2>/dev/null || echo "$PARENT_URL")

          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            PAYLOAD=$(jq -n \
              --arg title "critic blocker — 머지 차단" \
              --arg url "$COMMENT_URL" \
              --arg context "parent: $PARENT_URL" \
              '{text: "🚨 *\($title)*\n\($context)\n👀 <\($url)|GitHub 코멘트 열기>"}')
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
          fi
          exit 1

      - name: Concerns — 머지 + 상태파일 경로 전달
        id: concerns-merge
        if: steps.verdict.outputs.critic_verdict == 'concerns'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PR_REPO: ${{ inputs.pr-repo }}
          PR_NUMBER: ${{ inputs.pr-number }}
          TRACKING_ENABLED: ${{ inputs.tracking-enabled }}
          # [수정 4] verdict step 이 이미 식별한 STATE_FILE 경로를 재사용한다.
          # concerns-merge 가 독립적으로 재식별하면 사이의 gh pr merge 로 인해
          # 두 호출이 다른 결과를 낼 수 있는 TOCTOU 가 생긴다. verdict output 재사용으로
          # 스크립트 호출 1회 절약 + 두 step 일관성 보장.
          # tracking=false 면 STATE_FILE 이 빈값이어도 track-findings step 자체가 안 돌아 무방.
          VERDICT_RESOLVED_STATE_FILE: ${{ steps.verdict.outputs.resolved-state-file }}
        run: |
          set -euo pipefail
          # 머지는 추적과 무관한 책임 — 항상 수행(기존 동작 보존, tracking 게이트 밖)
          gh pr merge "$PR_NUMBER" --squash --repo "$PR_REPO"

          # 상태파일 경로는 verdict step 이 이미 식별해 output 으로 넘겨줬다.
          # tracking=true 이고 경로가 있으면 track-findings 에 전달, 없으면 추적 스킵.
          STATE_FILE="${VERDICT_RESOLVED_STATE_FILE:-}"
          if [ "$TRACKING_ENABLED" = "true" ]; then
            if [ -n "$STATE_FILE" ]; then
              echo "concerns: 상태파일 경로 재사용 — $STATE_FILE"
            else
              echo "::warning::concerns: 상태파일 경로 미식별(verdict step indeterminate) — 추적 스킵"
            fi
          fi
          echo "state-file=$STATE_FILE" >> "$GITHUB_OUTPUT"

      - name: Concerns — critic findings 추적(라벨 이슈)
        if: steps.verdict.outputs.critic_verdict == 'concerns' && inputs.tracking-enabled && steps.concerns-merge.outputs.state-file != ''
        uses: ./.pipeline-action-checkout/actions/track-findings
        with:
          state-file-path: ${{ steps.concerns-merge.outputs.state-file }}
          finding-source: critic
          owner: ${{ inputs.owner }}
          parent-repo: ${{ inputs.parent-repository }}
          major-label: ${{ inputs.major-label }}
          minor-label: ${{ inputs.minor-label }}
          gh-token: ${{ steps.merge-token.outputs.token }}

      - name: Pass — 머지
        if: steps.verdict.outputs.critic_verdict == 'pass'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PR_REPO: ${{ inputs.pr-repo }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --repo "$PR_REPO"

      # fail-closed 차단 경로: verdict 가 pass/concerns/blocker 중 어느 것도 아니면
      # (indeterminate=0건/복수 매칭, unknown, 빈값 등) 검증 불능이므로 머지하지 않고
      # blocker 와 동일하게 차단 + 에스컬레이션한다. 위 Pass/Concerns 머지 step 의 if 는
      # 각각 'pass'/'concerns' 정확 일치라, indeterminate/unknown 은 어느 머지 step 에도
      # 걸리지 않는다(=gh pr merge 미실행). 사람이 verdict 를 직접 확인한 뒤 진행해야 한다.
      - name: 검증 불능 — Slack 에스컬레이션 + 머지 차단 (fail-closed)
        if: steps.verdict.outputs.critic_verdict != 'pass' && steps.verdict.outputs.critic_verdict != 'concerns' && steps.verdict.outputs.critic_verdict != 'blocker'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PARENT_URL: ${{ needs.check-and-critic.outputs.parent_url }}
          CRITIC_VERDICT: ${{ steps.verdict.outputs.critic_verdict }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # printf 로 body 구성 — YAML 멀티라인 0칸 들여쓰기 방지
          BODY=$(printf '## ⚠️ critic verdict 검증 불능 — 머지 차단\n\ncritic verdict 를 확정할 수 없어 머지를 차단했어요(상태파일 매칭 0개 또는 복수, 혹은 verdict 빈값). verdict 값: %s. 사람이 확인 후 진행이 필요합니다.\n\n**Actions 로그**: %s' "$CRITIC_VERDICT" "$RUN_URL")
          COMMENT_URL=$(gh issue comment "$PARENT_URL" \
            --body "$BODY" \
            --json url --jq .url 2>/dev/null || echo "$PARENT_URL")

          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            PAYLOAD=$(jq -n \
              --arg title "critic verdict 검증 불능 — 머지 차단" \
              --arg url "$COMMENT_URL" \
              --arg context "parent: $PARENT_URL" \
              '{text: "⚠️ *\($title)*\n\($context)\n👀 <\($url)|GitHub 코멘트 열기>"}')
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
          fi
          exit 1
