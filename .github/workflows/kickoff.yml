name: kickoff

on:
  workflow_call:
    inputs:
      parent-url:
        description: "Parent issue URL"
        type: string
        required: true
      working-directory:
        description: "self-hosted runner 작업 디렉토리 (vars.PIPELINE_WORKING_DIRECTORY)"
        type: string
        required: true
      owner:
        description: "GitHub 조직/사용자 — URL 검증 패턴에 사용 (vars.PIPELINE_OWNER)"
        type: string
        required: true
      pipeline-repo:
        description: "Pipeline 레포 (owner/repo) — claude plugin 로드용 체크아웃 대상. 필수"
        type: string
        required: true
      pipeline-ref:
        description: "Pipeline 레포 ref — plugin 체크아웃 시 사용 (기본 main)"
        type: string
        required: false
        default: 'main'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  kickoff:
    # claude CLI + 로컬 환경이 있는 self-hosted runner 필요
    runs-on: self-hosted
    timeout-minutes: 60
    concurrency:
      group: kickoff-${{ inputs.parent-url }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Parent URL 검증
        env:
          PARENT_URL: ${{ inputs.parent-url }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          if [ -z "${PARENT_URL:-}" ]; then
            echo "parent-url 미지정 — 종료" >&2
            exit 1
          fi
          # script injection 방지 — owner 조직의 issue URL 만 허용
          if [[ ! "$PARENT_URL" =~ ^https://github\.com/${OWNER}/[A-Za-z0-9._-]+/issues/[0-9]+$ ]]; then
            echo "Invalid parent URL: $PARENT_URL" >&2
            exit 1
          fi
          echo "Parent URL 검증 완료: $PARENT_URL"

      # ── Pipeline 체크아웃 (claude plugin 로드용) ──
      # claude 호출이 /pipeline:kickoff 슬래시커맨드를 plugin 으로 로드하려면 이 시점에
      # Pipeline 레포의 plugin/ 이 있어야 한다. 그래서 claude 호출 step "앞"에 둔다.
      # 이 reusable workflow 가 영역(caller) 레포에서 호출되면 actions/checkout 의 기본
      # 대상은 caller(영역) 레포라 plugin/ 이 없어 실패한다. 따라서 Pipeline 레포
      # (repository/ref)를 명시해 정확히 체크아웃한다(종속성 제로 — 식별자는 input 주입).
      # working-directory(self-hosted 실제 작업 경로)를 덮어쓰지 않도록 path 로 별도
      # 디렉토리에 체크아웃한다(review.yml 과 동일 패턴).
      # 전제: Pipeline 레포가 public 이다(caller GITHUB_TOKEN 으로 타 레포는 public 만 읽힘).
      # private/internal 전환 시 별도 token input 추가 필요.
      - name: Pipeline 체크아웃 (plugin 로드용)
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline-action-checkout

      - name: /pipeline:kickoff --bot 실행
        env:
          PARENT_URL: ${{ inputs.parent-url }}
        run: |
          set -euo pipefail
          # --plugin-dir 로 Pipeline plugin 로드 → /pipeline:kickoff 사용.
          #   plugin 경로는 위 체크아웃이 GITHUB_WORKSPACE 에 받은 .pipeline-action-checkout/plugin.
          #   working-directory 가 GITHUB_WORKSPACE 와 다를 수 있어 절대경로로 지정한다.
          claude --dangerously-skip-permissions --plugin-dir "$GITHUB_WORKSPACE/.pipeline-action-checkout/plugin" -p "/pipeline:kickoff $PARENT_URL --bot"
