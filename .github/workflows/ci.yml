# Pipeline 레포 자체 정적 검사 CI
# - actionlint: 워크플로 yml 문법 + run 블록 쉘(shellcheck) 검사
# - tsc: App(TypeScript) 타입 검사
# run 블록 안에 들여쓰기 0칸 Python 등으로 YAML 파싱이 깨지는 사고를 커밋 시점에 차단한다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 워크플로 yml 정적 검사 — actionlint 가 run 블록 쉘을 추출해 shellcheck 로 검사
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      # 버전 핀 필수 (rolling tag 금지). shellcheck 는 ubuntu 러너 기본 제공분 사용.
      - name: actionlint 실행
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # App TypeScript 타입 검사 — app/package.json 의 lint 스크립트(tsc --noEmit) 재사용
  tsc:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: Node 20 셋업
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: 의존성 설치
        working-directory: app
        run: npm ci

      - name: 타입 검사
        working-directory: app
        run: npm run lint

  # App 단위 테스트 — 결정 로직(파서·집계·env) 회귀 그물망 (vitest)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: Node 20 셋업
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: 의존성 설치
        working-directory: app
        run: npm ci

      - name: 테스트 파일 타입 검사
        working-directory: app
        run: npm run typecheck:test

      - name: 단위 테스트
        working-directory: app
        run: npm test

  # plugin 셸 테스트 — skills/agents 의 standalone *.test.sh 를 aggregate 러너로 강제
  # (순수 bash. Node 불필요. 새 *.test.sh 는 러너가 glob 으로 자동 수집)
  plugin-test:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: plugin 셸 테스트 실행
        run: bash plugin/test/run-tests.sh

  # scripts 셸 테스트 — install.sh 함수 단위 + merge.yml CI 게이트 분기 가드 등.
  # (순수 bash + python3 + gh stub. Node 불필요. 새 test-*.sh 는 러너가 glob 으로 자동 수집)
  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: scripts 셸 테스트 실행
        run: bash scripts/test/run-tests.sh

  # 버전 게이트 — plugin/ 코드가 바뀌었는데 plugin.json 의 version 을 안 올린 PR 을 차단.
  # PR 컨텍스트에서만 동작(base 브랜치와 비교가 필요). push 빌드에서는 base 가 없어 자동 스킵.
  version-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃 (전체 히스토리 — base 비교용)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: plugin/ 변경 시 버전 상승 강제
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          PLUGIN_JSON="plugin/.claude-plugin/plugin.json"

          # base 브랜치를 명시적으로 가져온다(얕은 클론 방지는 fetch-depth:0 이 처리하지만,
          # base ref 의 원격 추적 브랜치가 없을 수 있어 확실히 fetch).
          git fetch --no-tags origin "$BASE_REF"

          # 이 PR 이 plugin/ 아래 파일을 건드렸는가? (base...HEAD = 머지베이스 이후 변경분)
          # 파이프 대신 here-string: set -o pipefail 하에서 grep -q 조기종료가 git diff 에
          # SIGPIPE(141)를 유발해 게이트를 잘못 스킵하는 것 방지(#88 과 동일한 회피).
          changed_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if grep -q '^plugin/' <<< "$changed_files"; then
            echo "plugin/ 변경 감지 — 버전 상승 여부 확인"
          else
            echo "plugin/ 변경 없음 — 버전 게이트 통과(스킵)"
            exit 0
          fi

          # base 의 version 추출 (jq 불필요 — python3)
          base_version="$(git show "origin/$BASE_REF:$PLUGIN_JSON" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          head_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$PLUGIN_JSON")"

          echo "base version=$base_version / head version=$head_version"

          if [ "$base_version" = "$head_version" ]; then
            echo "::error::plugin/ 코드가 바뀌었는데 버전을 안 올렸습니다. scripts/bump-version.sh 로 올리세요"
            exit 1
          fi

          echo "버전 상승 확인($base_version → $head_version) — 게이트 통과"
