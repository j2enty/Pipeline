name: sub-issue 전부 닫히면 parent 자동 close

# 이 파일은 영역 레포(.github/workflows/)에 복사해서 사용하는 호출자 yml 예시.
# Pipeline 레포의 parent-autoclose.yml reusable workflow를 호출만 함.

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close-parent:
    uses: __PIPELINE_REPO__/.github/workflows/parent-autoclose.yml@__PIPELINE_REF__
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_PRIVATE_KEY: ${{ secrets.AUTHOR_PRIVATE_KEY }}
