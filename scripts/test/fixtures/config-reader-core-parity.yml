# 테스트용 더미 config — pipeline-config.sh 리더 3벌의 "공유 파싱 코어" 드리프트 감지용.
# 실제 프로젝트 식별자 없음. 공유 코드경로를 넓게 자극하려고 다양한 케이스를 섞었다:
#   따옴표값·따옴표 안 #·인라인 주석·빈 따옴표·모듈 플래그 전종류·legacy area-ids 폴백·토글.

project:
  owner: parity-org
  parent-repository: parity-org/group/parent-repo   # a/b/c → repo 부분은 parent-repo
  project-numbers: [7, 9]
  working-directory: /tmp/parity-workspace
  slack-channel: "#parity-alerts"                    # 따옴표 안 # 보존

modules:
  - name: Backend
    role: server
    planner: true
    review: true
    kickoff: true
    lead: true
    default-status: Backlog
    cross-area-group: core
    area-id: AREA_BACKEND
    ci-workflow-name: "Backend CI"                    # 따옴표값
  - name: Admin
    role: admin
    planner: false
    review: false
    kickoff: false
    lead: false
    default-status: Ready
    cross-area-group: core
    ci-workflow-name: "Admin CI"  # 인라인 주석 뒤 값
  - name: Design
    role: design
    area-id: ""                                       # 빈 따옴표 → legacy 폴백 대상

modules-ignore:
  - Design

reviewer:
  enabled: false

pipeline:
  repo: parity-org/Pipeline
  ref: main

claude-commands:
  enabled: false
  project-name: ParityProject
  project-id: PVT_parity123
  status-field-id: PVTSSF_status456
  area-field-id: PVTSSF_area789
  author-login: parity-author
  local-account: parity-local
  docs-context-dir: docs/context
  # 아래 키들은 리더별로 의도적으로 다르다(비교 대상 아님):
  #   reviewer-* / slack-token-key → kickoff·review 만 / cross-check-tool → plan 만
  reviewer-app-id: "9999"
  reviewer-bot-slug: parity-review-bot
  reviewer-token-key: PARITY_REVIEWER_TOKEN
  slack-token-key: PARITY_SLACK_WEBHOOK
  cross-check-tool: codex
  area-ids:
    Design: AREA_DESIGN_LEGACY                        # 모듈 area-id 빈값 → 이 legacy 로 폴백
    Docs: AREA_DOCS_LEGACY

  plan:
    completeness-critic-enabled: true
    consistency-critic-enabled: false
    consistency-critic-dual-model: true
    contract-doc-enabled: false

  metrics:
    usage-tracking-enabled: true

tracking:
  enabled: false
