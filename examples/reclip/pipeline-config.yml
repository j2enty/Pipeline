# Reclip 프로젝트 Pipeline 설정
# 첫 번째 적용 사례 — examples/reclip/

project:
  owner: MKFactory-Reclip
  parent-repository: MKFactory-Reclip/Reclip
  # 폴러가 동시에 모니터링할 GitHub Project v2 번호 배열
  # (예: 마일스톤 보드 + 상시 CS/버그 보드)
  project-numbers: [3]
  working-directory: /Users/miller/Home/Develop/MKFactory/Reclip
  slack-channel: "#reclip-alerts"

modules:
  - name: Backend
    ci-workflow-name: Backend CI
  - name: Admin
    ci-workflow-name: Admin CI
    # Admin은 Reviewer 봇 외 리뷰도 허용 (strict 완화)
    strict-review-bot-check: false
  - name: Frontend
    ci-workflow-name: Frontend CI
  - name: iOS
    ci-workflow-name: ""
  - name: Android
    ci-workflow-name: ""

modules-ignore:
  - Design

reviewer:
  enabled: true

pipeline:
  repo: j2enty/Pipeline
  ref: main

claude-commands:
  # /review, /kickoff, /plan 슬래시커맨드를 워크스페이스 .claude/commands/ 에 배포
  # __ORG__/__PARENT_REPO_NAME__/__PROJECT_NUMBER__/__SLACK_CHANNEL__ 은 project 섹션에서 자동 파생
  enabled: true

  project-name: Reclip

  project-id: PVT_kwDOEH36Hs4BU4t1
  status-field-id: PVTSSF_lADOEH36Hs4BU4t1zhIm_rs
  area-field-id: PVTSSF_lADOEH36Hs4BU4t1zhIoXNU

  reviewer-app-id: "3569774"
  reviewer-bot-slug: reclip-review-bot
  reviewer-token-key: RECLIP_REVIEW_BOT

  slack-token-key: RECLIP_SLACK_WEBHOOK

  author-login: mkfactory-app
  local-account: j2enty
  docs-context-dir: Docs/claude/context

  area-ids:
    Backend: 7a506b5e
    Admin: 5a5a0f78
    Frontend: 40db0ae8
    iOS: 2f0a7bda
    Android: 7394b300
    Design: 56405937

tracking:
  # finding(리뷰 지적) 추적 이슈 자동 생성 on/off
  enabled: true
  major-label: "major-issue"
  minor-label: "minor-issue"
