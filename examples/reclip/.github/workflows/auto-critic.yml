name: Auto critic (sibling all-approved /review --bot merge)

# 이 파일은 영역 레포(.github/workflows/)에 복사해서 사용하는 호출자 yml 예시.
# Pipeline 레포의 critic.yml reusable workflow를 호출함.
#
# 트리거: Reviewer 봇의 APPROVE 리뷰 제출
# 1) 같은 parent에 묶인 모든 sibling PR이 APPROVED인지 확인
# 2) 모두 APPROVED → critic 실행 → verdict에 따라 처리

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  critic:
    # Reviewer 봇 APPROVE 시만 진입
    if: |
      github.event.review.state == 'approved' &&
      startsWith(github.event.review.user.login, 'reclip-review-bot')
    uses: j2enty/Pipeline/.github/workflows/critic.yml@main
    with:
      pr-repo: ${{ github.event.pull_request.base.repo.full_name }}
      pr-number: ${{ github.event.pull_request.number }}
      reviewer-bot-login: ${{ vars.PIPELINE_REVIEWER_BOT_LOGIN }}
      working-directory: ${{ vars.PIPELINE_WORKING_DIRECTORY }}
      owner: ${{ vars.PIPELINE_OWNER }}
      parent-repository: ${{ vars.PIPELINE_PARENT_REPOSITORY }}
      modules-ignore: ${{ vars.PIPELINE_MODULES_IGNORE || '[]' }}
      strict-review-bot-check: ${{ vars.PIPELINE_STRICT_REVIEW_BOT_CHECK == 'true' }}
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_PRIVATE_KEY: ${{ secrets.AUTHOR_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
