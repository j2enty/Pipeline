# kickoff 리더 테스트용 합성 픽스처.
# review/plan 리더 픽스처와 동일 구조 + #42 모듈 동작표(lead·kickoff 플래그·area-id).
# 실제 시크릿 아님 — App PEM·토큰·webhook URL 은 없고, env 변수 이름표/합성 식별자만.
# 모듈명은 특정 프로젝트 비종속 일반명(Alpha/Beta/Gamma) — 리더 인터페이스만 검증.
project:
  owner: BlueOrg
  parent-repository: BlueOrg/MainRepo
  project-numbers: [7, 9]
  slack-channel: "#blue-alerts"

modules:
  # Alpha — 선행(lead) 모듈
  - name: Alpha
    role: server
    area-id: aa11bb22
    lead: true
    kickoff: true
  # Beta — 일반 kickoff 대상
  - name: Beta
    role: client
    area-id: bb22cc33
    kickoff: true
  # Gamma — kickoff 제외 모듈(디자인류)
  - name: Gamma
    role: design
    area-id: cc33dd44
    kickoff: false

claude-commands:
  enabled: true
  project-name: BlueProject
  project-id: PVT_blue123
  status-field-id: PVTSSF_status9
  area-field-id: PVTSSF_area9
  reviewer-app-id: "9988776"
  reviewer-bot-slug: blue-review-bot
  reviewer-token-key: BLUE_REVIEW_BOT
  slack-token-key: BLUE_SLACK_WEBHOOK
  author-login: test-bot
  local-account: blue-dev   # 무따옴표 값 뒤 인라인 주석 — 스트립되어야 함
  docs-context-dir: Docs/claude/context
  area-ids:
    Backend: aa11bb22
    Admin: bb22cc33
    Frontend: cc33dd44
    iOS: dd44ee55
    Android: ee55ff66
    Design: ff66aa77
  plan:
    completeness-critic-enabled: true
    consistency-critic-enabled: false
    consistency-critic-dual-model: "false"
    # contract-doc-enabled 누락 → 기본 true 여야 함
