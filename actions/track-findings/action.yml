# track-findings — 리뷰 finding 을 GitHub 이슈로 추적하는 재사용 composite action
#
# 무엇을: 리뷰가 상태파일(.omc/state/reviews/<slug>.json)에 저장한 finding(지적사항)을
#         읽어, major/minor 만 골라 GitHub 이슈로 만든다. self-hosted 러너의 리뷰
#         워크플로(review.yml / critic.yml)가 호출한다.
#
# 핵심 원칙:
#   - 추적 실패가 상위 리뷰/머지를 막지 않는다 — 모든 실패는 흡수(graceful, exit 0).
#   - 프로젝트 식별자 하드코딩 제로 — owner/area/repo/라벨 전부 input 주입.
#   - 중복 이슈 방지: 결정적 fingerprint(LLM 비결정 요소 배제) + intra/cross-run 이중 dedup.
#
# 입력 데이터 스키마:
#   - code-review: .prs[<area>].findings.codeReview[] = {severity,file,line,title,description,suggestion}
#   - critic:      .aggregate.criticFindings[]        = {severity,area,title,description,affected_prs}

name: track-findings
description: "리뷰 상태파일의 finding 을 읽어 major/minor 를 GitHub 이슈로 추적(생성)한다"

inputs:
  state-file-path:
    description: "읽을 상태파일 절대경로"
    required: true
  finding-source:
    description: "finding 출처 — 'code-review' | 'critic'"
    required: true
  owner:
    description: "GitHub 조직/사용자"
    required: true
  area:
    description: "영역명 (code-review 모드, 예: Backend). 상태파일 prs.<area> 키"
    required: false
    default: ''
  area-repo:
    description: "이슈 생성 대상 <owner>/<repo> (code-review 모드)"
    required: false
    default: ''
  parent-repo:
    description: "이슈 생성 대상 <owner>/<repo> (critic 모드)"
    required: false
    default: ''
  major-label:
    description: "major finding 이슈에 붙일 라벨"
    required: false
    default: 'major-issue'
  minor-label:
    description: "minor finding 이슈에 붙일 라벨"
    required: false
    default: 'minor-issue'
  gh-token:
    description: "이슈 생성용 토큰(caller 가 Author App 토큰 발급해 전달)"
    required: true

runs:
  using: composite
  steps:
    - name: finding 추출 + 이슈 생성
      shell: bash
      env:
        STATE_FILE_PATH: ${{ inputs.state-file-path }}
        FINDING_SOURCE: ${{ inputs.finding-source }}
        OWNER: ${{ inputs.owner }}
        AREA: ${{ inputs.area }}
        AREA_REPO: ${{ inputs.area-repo }}
        PARENT_REPO: ${{ inputs.parent-repo }}
        MAJOR_LABEL: ${{ inputs.major-label }}
        MINOR_LABEL: ${{ inputs.minor-label }}
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set -euo pipefail

        # ── 1. 파일 부재 → graceful 종료 (추적 실패가 상위를 막지 않음) ──
        if [ -z "${STATE_FILE_PATH:-}" ] || [ ! -f "$STATE_FILE_PATH" ]; then
          echo "::warning::track-findings: 상태파일 없음 ($STATE_FILE_PATH) — 추적 스킵"
          exit 0
        fi

        # ── 2. 대상 레포 결정 ──
        case "$FINDING_SOURCE" in
          code-review)
            TARGET_REPO="$AREA_REPO"
            if [ -z "${AREA:-}" ] || [ -z "${TARGET_REPO:-}" ]; then
              echo "::warning::track-findings: code-review 모드엔 area + area-repo 필요 — 스킵"
              exit 0
            fi
            ;;
          critic)
            TARGET_REPO="$PARENT_REPO"
            if [ -z "${TARGET_REPO:-}" ]; then
              echo "::warning::track-findings: critic 모드엔 parent-repo 필요 — 스킵"
              exit 0
            fi
            ;;
          *)
            echo "::warning::track-findings: 알 수 없는 finding-source ($FINDING_SOURCE) — 스킵"
            exit 0
            ;;
        esac

        # ── 3. jq 로 finding 추출 (major/minor 만). 키 부재(구버전 파일)는 ?/// empty 로 graceful ──
        #    각 finding 을 한 줄 JSON(NDJSON)으로 출력 → 셸 루프에서 한 줄씩 처리.
        if [ "$FINDING_SOURCE" = "code-review" ]; then
          # $a 는 jq 변수 — single quote 안 미확장 의도적
          # shellcheck disable=SC2016
          FINDINGS_NDJSON=$(jq -c --arg a "$AREA" \
            '(.prs[$a].findings.codeReview // [])[]?
             | select(.severity == "major" or .severity == "minor")' \
            "$STATE_FILE_PATH" 2>/dev/null || true)
        else
          FINDINGS_NDJSON=$(jq -c \
            '(.aggregate.criticFindings // [])[]?
             | select(.severity == "major" or .severity == "minor")' \
            "$STATE_FILE_PATH" 2>/dev/null || true)
        fi

        if [ -z "${FINDINGS_NDJSON:-}" ]; then
          echo "track-findings: 추적할 finding 없음 (source=$FINDING_SOURCE, target=$TARGET_REPO)"
          exit 0
        fi

        # ── 4. python3 헬퍼 본문 (heredoc) ──
        #    finding JSON + 메타를 받아 'fp\t제목\t라벨\t본문(base64)' 출력.
        #    본문은 개행 포함이라 base64 로 안전 전달.
        #    들여쓰기 주의: 이 run 블록은 YAML block scalar(8칸 base)라 GHA 가 8칸을 제거한다.
        #    heredoc body 의 python 줄은 이 8칸 base 위에 python 들여쓰기를 얹은 것 →
        #    GHA strip 후 python 최상위=0칸, 중첩=4칸으로 떨어져 그대로 유효하다.
        PY_HELPER=$(cat <<'PYEOF'
        import sys, os, json, hashlib, base64, re

        finding = json.loads(sys.argv[1])
        source = os.environ["FINDING_SOURCE"]
        area = os.environ.get("AREA", "")
        major_label = os.environ["MAJOR_LABEL"]
        minor_label = os.environ["MINOR_LABEL"]

        def normalize(title):
            # lowercase → 영숫자·공백만 → 공백 1칸 정규화 → 앞 60자
            t = (title or "").lower()
            t = re.sub(r"[^a-z0-9\s]", " ", t)
            t = re.sub(r"\s+", " ", t).strip()
            return t[:60]

        severity = (finding.get("severity") or "").strip()
        title = (finding.get("title") or "").strip()
        description = (finding.get("description") or "").strip()
        suggestion = (finding.get("suggestion") or "").strip()
        norm_title = normalize(title)

        if source == "code-review":
            file_path = (finding.get("file") or "").strip()
            line = finding.get("line")
            fp_basis = f"{file_path}|{severity}|{norm_title}"
        else:  # critic — file 없음, area 기반
            file_path = ""
            line = None
            fp_basis = f"{area}|{severity}|{norm_title}"

        fp = hashlib.sha256(fp_basis.encode("utf-8")).hexdigest()[:12]

        label = major_label if severity == "major" else minor_label

        # ── 이슈 본문 렌더 ──
        lines = []
        lines.append(f"**severity**: {severity}")
        if source == "code-review":
            loc = file_path if file_path else "(파일 정보 없음)"
            if line is not None and line != "":
                loc = f"{loc}:{line}"
            lines.append(f"**위치**: {loc}")
        else:
            affected = finding.get("affected_prs") or []
            if area:
                lines.append(f"**영역**: {area}")
            if affected:
                lines.append("**영향 PR**: " + ", ".join(str(p) for p in affected))
        if description:
            lines.append("")
            lines.append("## 설명")
            lines.append(description)
        if suggestion:
            lines.append("")
            lines.append("## 제안")
            lines.append(suggestion)
        if source == "code-review" and line is not None and line != "":
            lines.append("")
            lines.append("> ⚠️ line 은 리뷰 당시 기준 — 머지 후 무효일 수 있음")
        lines.append("")
        lines.append(f"<!-- finding-fp: {fp} -->")
        body = "\n".join(lines)

        issue_title = f"[{severity}] {title}" if title else f"[{severity}] finding {fp}"
        body_b64 = base64.b64encode(body.encode("utf-8")).decode("ascii")

        # fp \t 제목 \t 라벨 \t 본문(base64) — 제목에 탭/개행 정규화
        issue_title = issue_title.replace("\t", " ").replace("\n", " ")
        sys.stdout.write(f"{fp}\t{issue_title}\t{label}\t{body_b64}\n")
        PYEOF
        )

        render_finding() {
          # $1: finding JSON 한 줄 → stdout: 'fp\t제목\t라벨\t본문(base64)'
          # AREA 는 critic 모드에서 비어있을 수 있어 ${AREA:-} 로 방어(set -u 안전)
          FINDING_SOURCE="$FINDING_SOURCE" AREA="${AREA:-}" \
          MAJOR_LABEL="$MAJOR_LABEL" MINOR_LABEL="$MINOR_LABEL" \
          python3 -c "$PY_HELPER" "$1"
        }

        # ── 5. 각 finding 처리: intra-run + cross-run dedup → 이슈 생성 ──
        SEEN_FPS=""   # intra-run 누적 set (공백 구분 ' <fp> ' 패턴으로 검사)
        CREATED=0
        SKIPPED=0

        while IFS= read -r FINDING_LINE; do
          [ -z "$FINDING_LINE" ] && continue

          # render: 'fp\t제목\t라벨\t본문(base64)'
          RENDERED=$(render_finding "$FINDING_LINE" || true)
          [ -z "$RENDERED" ] && { echo "::warning::track-findings: finding 렌더 실패 — 스킵"; continue; }

          FP=$(printf '%s' "$RENDERED" | cut -f1)
          ISSUE_TITLE=$(printf '%s' "$RENDERED" | cut -f2)
          ISSUE_LABEL=$(printf '%s' "$RENDERED" | cut -f3)
          BODY_B64=$(printf '%s' "$RENDERED" | cut -f4)
          [ -z "$FP" ] && continue

          # intra-run 중복 차단 (같은 run 내 재생성 스킵)
          case " $SEEN_FPS " in
            *" $FP "*)
              echo "track-findings: [$FP] intra-run 중복 — 스킵"
              SKIPPED=$((SKIPPED + 1))
              continue
              ;;
          esac
          SEEN_FPS="$SEEN_FPS $FP"

          # cross-run 중복 차단 (gh search — 인덱싱 지연 가능 → intra-run set 과 이중 방어)
          EXISTING=$(gh search issues "$FP" --repo "$TARGET_REPO" --state open --json number \
            --jq 'length' 2>/dev/null || echo "0")
          if [ "${EXISTING:-0}" != "0" ]; then
            echo "track-findings: [$FP] 이미 오픈 이슈 존재 — 스킵"
            SKIPPED=$((SKIPPED + 1))
            continue
          fi

          # 이슈 생성 (개별 실패는 || true 로 흡수 — 나머지를 막지 않음)
          BODY=$(printf '%s' "$BODY_B64" | base64 --decode)
          if gh issue create --repo "$TARGET_REPO" \
              --title "$ISSUE_TITLE" \
              --body "$BODY" \
              --label "$ISSUE_LABEL" >/dev/null 2>&1; then
            echo "track-findings: [$FP] 이슈 생성 ($ISSUE_LABEL): $ISSUE_TITLE"
            CREATED=$((CREATED + 1))
          else
            echo "::warning::track-findings: [$FP] 이슈 생성 실패 — 흡수하고 계속"
          fi
        done <<< "$FINDINGS_NDJSON"

        echo "track-findings: 완료 — 생성 $CREATED, 스킵 $SKIPPED (target=$TARGET_REPO)"
        exit 0
