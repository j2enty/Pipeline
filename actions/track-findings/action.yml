# track-findings — 리뷰 finding 을 GitHub 이슈로 추적하는 재사용 composite action
#
# 무엇을: 리뷰가 상태파일(.pipeline/state/reviews/<slug>.json)에 저장한 finding(지적사항)을
#         읽어, major/minor 만 골라 GitHub 이슈로 만든다. self-hosted 러너의 리뷰
#         워크플로(review.yml / critic-dispatch.yml)가 호출한다.
#
# 왜 얇은가(#104 M9): 추출 로직(fingerprint 렌더·intra/cross-run dedup·이슈 생성)은
#   scripts/track-findings.sh + scripts/render-finding.py 로 옮겨 단위테스트(회귀 그물)
#   대상으로 만들었다. 이 action.yml 은 그 스크립트를 호출만 한다(ensure-plugin 과 동일 패턴).
#   실행 방식: `bash <path>` — 체크아웃된 .sh 의 실행권한(+x)이 유실돼도 exit 126 로 죽지 않게.
#   스크립트 위치는 이 action 의 형제 경로($GITHUB_ACTION_PATH/../../scripts)로 해석한다.
#
# 핵심 원칙:
#   - 추적 실패가 상위 리뷰/머지를 막지 않는다 — 모든 실패는 흡수(graceful, exit 0).
#   - 프로젝트 식별자 하드코딩 제로 — owner/area/repo/라벨 전부 input 주입.
#   - 중복 이슈 방지: 결정적 fingerprint(LLM 비결정 요소 배제) + intra/cross-run 이중 dedup.
#
# 입력 데이터 스키마:
#   - code-review: .prs[<area>].findings.codeReview[] = {severity,file,line,title,description,suggestion}
#   - critic:      .aggregate.criticFindings[]        = {severity,area,title,description,affected_prs}

name: track-findings
description: "리뷰 상태파일의 finding 을 읽어 major/minor 를 GitHub 이슈로 추적(생성)한다"

inputs:
  state-file-path:
    description: "읽을 상태파일 절대경로"
    required: true
  finding-source:
    description: "finding 출처 — 'code-review' | 'critic'"
    required: true
  owner:
    description: "GitHub 조직/사용자"
    required: true
  area:
    description: "영역명 (code-review 모드, 예: Backend). 상태파일 prs.<area> 키"
    required: false
    default: ''
  area-repo:
    description: "이슈 생성 대상 <owner>/<repo> (code-review 모드)"
    required: false
    default: ''
  parent-repo:
    description: "이슈 생성 대상 <owner>/<repo> (critic 모드)"
    required: false
    default: ''
  major-label:
    description: "major finding 이슈에 붙일 라벨"
    required: false
    default: 'major-issue'
  minor-label:
    description: "minor finding 이슈에 붙일 라벨"
    required: false
    default: 'minor-issue'
  gh-token:
    description: "이슈 생성용 토큰(caller 가 Author App 토큰 발급해 전달)"
    required: true

runs:
  using: composite
  steps:
    - name: finding 추출 + 이슈 생성
      shell: bash
      env:
        STATE_FILE_PATH: ${{ inputs.state-file-path }}
        FINDING_SOURCE: ${{ inputs.finding-source }}
        OWNER: ${{ inputs.owner }}
        AREA: ${{ inputs.area }}
        AREA_REPO: ${{ inputs.area-repo }}
        PARENT_REPO: ${{ inputs.parent-repo }}
        MAJOR_LABEL: ${{ inputs.major-label }}
        MINOR_LABEL: ${{ inputs.minor-label }}
        GH_TOKEN: ${{ inputs.gh-token }}
      run: bash "${{ github.action_path }}/../../scripts/track-findings.sh"
